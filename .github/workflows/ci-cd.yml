name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate --config prisma7.config.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/indiabids
      - run: npm run build

  verify-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.indiabids.in/api/v1

  migrate-production:
    needs: [verify-backend, verify-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_AUTO_MIGRATE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Run Prisma Production Migrations
        run: npx prisma migrate deploy --config prisma7.config.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
